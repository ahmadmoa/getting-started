<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bias Board</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="shell">
        <header class="top">
            <div class="kicker">
                <span class="tag">Formulate a bias</span>
                <span class="sub" id="window-label">Headline consensus</span>
            </div>
            <div class="asset-title">
                <span class="badge" id="asset-badge">–</span>
                <h1 id="asset-name">Loading…</h1>
                <span class="symbol" id="asset-symbol"></span>
            </div>
        </header>

        <nav class="chips" id="chips" aria-label="Assets"></nav>

        <div class="notice" id="notice" hidden></div>

        <main class="grid">
            <section class="left">
                <div class="bias-head">
                    <div class="arrow-box" id="bias-arrow">–</div>
                    <div>
                        <div class="bias-word" id="bias-word">–</div>
                        <div class="lean" id="bias-lean"></div>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat"><div class="stat-num up" id="pct-higher">–</div><div class="stat-label">Bullish</div></div>
                    <div class="stat"><div class="stat-num" id="pct-mixed">–</div><div class="stat-label">Neutral</div></div>
                    <div class="stat"><div class="stat-num down" id="pct-lower">–</div><div class="stat-label">Bearish</div></div>
                </div>

                <div class="meter" aria-hidden="true">
                    <span class="m-up" id="bar-higher"></span><span class="m-mixed" id="bar-mixed"></span><span class="m-down" id="bar-lower"></span>
                </div>
                <div class="counts mono" id="counts"></div>

                <p class="summary" id="summary"></p>

                <div class="rule"></div>

                <div class="section-head">
                    <h2 id="now-title">Right now</h2>
                    <span class="hint" id="prices-updated"></span>
                </div>
                <div class="tiles" id="tiles"></div>

                <div class="rule"></div>

                <h2 id="stories-title">Stories driving</h2>
                <div class="stories" id="stories"></div>
            </section>

            <section class="right">
                <div class="section-head">
                    <h2 id="feed-title">Headlines</h2>
                    <div class="seg" role="tablist">
                        <button type="button" data-sort="newest" class="on">Newest</button>
                        <button type="button" data-sort="relevant">Most relevant</button>
                    </div>
                </div>
                <ol class="feed" id="feed"></ol>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
